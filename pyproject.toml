[project]
name = "uunawantsomething"
version = "0.10.0-alpha"
description = "Universal toolkit for World of Warcraft datamining"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "requests>=2.31.0",
    "duckdb>=1.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "sse-starlette>=1.6.0",
    "beautifulsoup4>=4.12.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "genson>=1.3.0",
    "jsonschema>=4.26.0",
    "psutil>=7.2.2",
    "pytest>=9.0.2",
    "responses>=0.25.8",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "anyio>=4.0.0",
    "ruff>=0.3.0",
    "responses>=0.25.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["Tools/tests"]
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "ruff>=0.15.1",
]
