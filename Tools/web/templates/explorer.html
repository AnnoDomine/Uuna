{% extends "base.html" %}
{% block content %}
<div class="row">
    <!-- Sidebar -->
    <div class="col-md-2 sidebar">
        <h5 class="mb-3 p-2 border-bottom border-secondary">Tables ({{ tables|length }})</h5>
        <div class="list-group list-group-flush" id="table-list">
            {% for table in tables %}
                <a href="/?table={{ table }}&db={{ current_db }}" 
                   class="list-group-item list-group-item-action {{ 'active' if table == current_table }}"
                   hx-get="/?table={{ table }}&db={{ current_db }}"
                   hx-target="#main-content"
                   hx-push-url="true">
                    {{ table }}
                </a>
            {% endfor %}
        </div>
    </div>

    <!-- Main Content -->
    <div class="col-md-10 px-4" id="main-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="m-0">Table: <span class="text-info">{{ current_table }}</span></h2>
            
            <div class="d-flex gap-3 align-items-center">
                <form action="/" method="get" class="d-flex">
                    <input type="hidden" name="db" value="{{ current_db }}">
                    <select name="db" class="form-select form-select-sm bg-dark text-light border-secondary" 
                            hx-get="/" hx-target="body" hx-push-url="true">
                        {% for d in dbs %}
                            <option value="{{ d }}" {{ 'selected' if d == current_db }}>{{ d.split('_')[-1].replace('.db', '') }}</option>
                        {% endfor %}
                    </select>
                </form>

                <input type="text" name="search" 
                       class="form-control form-control-sm bg-dark text-light border-secondary" 
                       placeholder="Search in table..." 
                       value="{{ search_val }}"
                       hx-get="/?table={{ current_table }}&db={{ current_db }}"
                       hx-trigger="keyup changed delay:500ms"
                       hx-target="#table-data-container"
                       hx-indicator="#search-indicator">
            </div>
        </div>

        <div id="table-data-container" class="position-relative">
            {% include "explorer_table.html" %}
        </div>
    </div>
</div>
{% endblock %}
