{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="mb-4">Global Settings</h2>
        
        <div id="settings-message"></div>

        <form hx-post="/settings" hx-target="#settings-message" class="card bg-dark border-secondary p-4">
            
            {% for group, items in grouped_settings.items() %}
                <h5 class="mb-3 text-info border-bottom border-secondary pb-2">{{ group }}</h5>
                
                {% for s in items %}
                    <div class="mb-4">
                        {% if s.type == 'bool' %}
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="{{ s.key }}" id="{{ s.key }}" 
                                       {{ 'checked' if s.value == '1' }}>
                                <label class="form-check-label fw-bold" for="{{ s.key }}">{{ s.name }}</label>
                            </div>
                        {% else %}
                            <label class="form-label fw-bold" for="{{ s.key }}">{{ s.name }}</label>
                            <input type="{{ 'number' if s.type == 'int' else 'text' }}" 
                                   name="{{ s.key }}" id="{{ s.key }}"
                                   class="form-control bg-dark text-light border-secondary" 
                                   value="{{ s.value }}">
                        {% endif %}
                        <div class="form-text text-muted">{{ s.description }}</div>
                    </div>
                {% endfor %}
                
                {% if not loop.last %}<div class="mb-4"></div>{% endif %}
            {% endfor %}

            <button type="submit" class="btn btn-primary w-100 mt-3">Save All Settings</button>
        </form>
    </div>
</div>
{% endblock %}
